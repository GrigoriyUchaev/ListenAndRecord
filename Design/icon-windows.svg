<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="150 190 760 700">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E9ECF1"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF5A4E"/>
      <stop offset="1" stop-color="#C8161D"/>
    </linearGradient>
    <linearGradient id="dark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B3121A"/>
      <stop offset="1" stop-color="#7E0A10"/>
    </linearGradient>
    <radialGradient id="mouth" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5E060B"/>
      <stop offset="1" stop-color="#9C0F16"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.22"/>
    </filter>
  </defs>
  
  <g transform="rotate(-14 512 512) translate(-30 10)" filter="url(#shadow)">
    <!-- handle -->
    <rect x="368" y="560" width="74" height="170" rx="30" fill="url(#dark)"/>
    <!-- rear cap -->
    <rect x="226" y="438" width="96" height="148" rx="34" fill="url(#dark)"/>
    <!-- cone -->
    <path d="M300 446 L668 300 Q700 300 700 340 L700 684 Q700 724 668 724 L300 578 Z" fill="url(#red)"/>
    <!-- highlight -->
    <path d="M318 462 L650 330 L650 372 L318 488 Z" fill="#FFFFFF" opacity="0.28"/>
    <!-- mouth rim -->
    <ellipse cx="700" cy="512" rx="62" ry="216" fill="url(#red)"/>
    <ellipse cx="704" cy="512" rx="40" ry="184" fill="url(#mouth)"/>
  </g>
  <!-- sound waves -->
  <g fill="none" stroke="#E0262C" stroke-linecap="round" stroke-width="30" transform="rotate(-14 512 512) translate(-30 10)">
    <path d="M800 420 Q838 512 800 604"/>
    <path d="M846 360 Q906 512 846 664" opacity="0.8"/>
  </g>
</svg>
